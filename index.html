<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Setlog</title>
<meta name="theme-color" content="#e5352a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Setlog">
<meta name="description" content="Ağırlık ve tekrarlarını kaydet, gelişimini takip et.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23e5352a'/%3E%3Cpath d='M20 20v24M13 26v12M44 20v24M51 26v12M20 32h24' stroke='white' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: sharp, athletic, confident — a training log a coach would carry
   IDEA: the gym logbook: big chalk numbers, red marks on the days you trained
   PICTURE: the anatomy heatmap and the progress line are the hero visuals
   COLOUR and TYPE: warm off-white / near-black, signal red; Archivo condensed numerals + Inter text
   LAYOUT: one phone column, frosted bottom tab bar, bottom sheets for every edit */
:root{color-scheme:light dark;
--bg:light-dark(#f3f2ef,#0b0b0c);--card:light-dark(#ffffff,#161618);--card2:light-dark(#ecebe7,#222225);
--ink:light-dark(#121212,#f4f3f0);--mute:light-dark(#75726c,#9d9b96);--line:light-dark(#e4e2dd,#2a2a2e);
--acc:#e5352a;--accSoft:light-dark(#fde7e4,#33140f);--good:light-dark(#178a48,#45c47f);
--h0:light-dark(#dcdad4,#2c2c30);--h1:#fbd3c3;--h2:#f6a283;--h3:#ee6545;--h4:#d22a1e;--h5:#870e09;--z1:light-dark(#fbcdb8,#6b2d1d);--z2:#f08a62;--z3:#e5352a;--z4:light-dark(#7e0f0a,#ff8a7a);
--neu:light-dark(#c9c6bf,#3d3d42);
--f:'Inter',system-ui,-apple-system,sans-serif;--d:'Archivo','Inter',system-ui,sans-serif}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f);overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
.app{max-width:540px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 10px) 16px calc(112px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0 16px}
h1{font:800 36px/1.02 var(--d);font-stretch:86%;letter-spacing:-.015em;margin:0;text-wrap:balance}
h2{font:750 21px/1.15 var(--d);font-stretch:92%;margin:0}
h3{font:650 16px/1.3 var(--f);margin:0}
.sub{color:var(--mute);font-size:14px;line-height:1.4}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:22px 2px 10px}
.card{background:var(--card);border-radius:22px;padding:16px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1}.wrap{flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;background:var(--card2);font-weight:600;font-size:15px;white-space:nowrap}
.btn.pri{background:var(--acc);color:#fff}.btn.white{background:#fff;color:var(--acc)}
.btn.ghost{background:transparent;color:var(--acc);padding:0 6px}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px;border-radius:11px}
.btn.block{width:100%}.btn.danger{color:var(--acc);background:var(--accSoft)}
.ibtn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;flex:none}
.ibtn.bg{background:var(--card2)}
.btn:active,.ibtn:active,.press:active{transform:scale(.97)}
:focus-visible{outline:2.5px solid var(--acc);outline-offset:2px}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 13px;border-radius:999px;background:var(--card2);font-size:14px;font-weight:600;white-space:nowrap;flex:none}
.chip.on{background:var(--ink);color:var(--bg)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.daytag{width:48px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--card2);color:var(--mute);font-size:13px;font-weight:600;flex:none}
.daytag.on{background:var(--acc);color:#fff}
.num{font-family:var(--d);font-variant-numeric:tabular-nums;font-stretch:88%}
.f{width:100%;height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);padding:0 14px;font-size:16px}
textarea.f{height:auto;min-height:110px;padding:12px;resize:vertical;font-size:14px;font-family:ui-monospace,monospace}
.l{display:block;font-size:13px;color:var(--mute);font-weight:600;margin:14px 2px 6px}
.list>*+*{border-top:1px solid var(--line)}
.li{display:flex;align-items:center;gap:12px;padding:13px 0;width:100%}
.av{border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:700;flex:none;font-family:var(--d)}
.empty{text-align:center;padding:30px 16px;color:var(--mute)}
.banner{background:var(--accSoft);color:var(--acc);border-radius:14px;padding:10px 14px;font-size:13px;font-weight:600;margin-bottom:12px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--card) 86%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:11px;font-weight:600;color:var(--mute);text-align:center}
nav.tabs button.on{color:var(--acc)}
/* hero */
.hero{background:var(--acc);color:#fff;padding:20px;position:relative;overflow:hidden}
.hero .k{font-size:13px;font-weight:600;opacity:.85}
.hero .t{font:850 46px/1 var(--d);font-stretch:80%;letter-spacing:-.01em;margin:6px 0 4px;text-transform:lowercase}
.hero .m{font-size:14px;opacity:.9;margin-bottom:16px}
.hero svg.deco{position:absolute;right:-24px;top:-8px;width:150px;opacity:.16;pointer-events:none}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.cal .wd{font-size:12px;color:var(--mute);font-weight:600;padding:2px 0 6px}
.cal .d{aspect-ratio:1/1.12;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font:650 15px var(--d);font-variant-numeric:tabular-nums}
.cal .d.out{opacity:.28}
.cal .d.today{box-shadow:inset 0 0 0 2px var(--ink)}
.cal .d.done{background:var(--acc);color:#fff}
.cal .d .t{font:700 9.5px var(--f);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.cal .d.plan .t{color:var(--mute)}
.wk{display:flex;align-items:center;gap:12px;padding:10px 0}
/* stats */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--card);border-radius:18px;padding:14px 12px}
.stat b{display:block;font:800 30px/1 var(--d);font-stretch:84%;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--mute);font-weight:600}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.bars{display:flex;align-items:flex-end;gap:6px;height:110px}
.bars>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bars i{display:block;width:100%;border-radius:7px 7px 3px 3px;background:var(--card2);min-height:4px}
.bars i.on{background:var(--acc)}
.bars small{font-size:10.5px;color:var(--mute);font-weight:600}
.delta{font-size:12px;font-weight:700;padding:2px 7px;border-radius:7px;background:var(--card2);white-space:nowrap}
.delta.up{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.delta.dn{color:var(--acc);background:var(--accSoft)}
/* program */
.ph{display:flex;align-items:center;gap:10px;padding:2px 0 12px}
.wrow{display:flex;align-items:center;gap:14px;padding:13px 0;width:100%;border-top:1px solid var(--line)}
.pfoot{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding-top:10px;margin-top:2px}
.exi{display:flex;gap:12px;align-items:center;padding:12px 0}
.exn{width:30px;height:30px;border-radius:9px;background:var(--card2);display:grid;place-items:center;font:700 14px var(--d);flex:none}
/* live */
.lhead{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);margin:0 -16px;padding:calc(env(safe-area-inset-top) + 6px) 16px 10px;display:flex;align-items:center;gap:8px}
.st{display:grid;grid-template-columns:24px minmax(0,1fr) 76px 64px 44px;gap:8px;align-items:center;padding:4px 0}
.st .h{font-size:11px;color:var(--mute);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.st input{height:44px;border-radius:11px;border:0;background:var(--card2);text-align:center;font:650 18px var(--d);font-variant-numeric:tabular-nums;width:100%}
.st input::placeholder{color:var(--mute);opacity:.6}
.st.rir{grid-template-columns:20px minmax(0,1fr) 64px 52px 46px 40px;gap:6px}
.st .pv{font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ck{width:44px;height:44px;border-radius:11px;background:var(--card2);display:grid;place-items:center;color:var(--mute)}
.st.ok input{background:color-mix(in srgb,var(--good) 16%,var(--card))}
.st.ok .ck{background:var(--good);color:#fff}
.setchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.sc{font:600 13px var(--d);font-variant-numeric:tabular-nums;background:var(--card2);padding:3px 9px;border-radius:8px;white-space:nowrap}
.sc.best{background:var(--accSoft);color:var(--acc)}
/* heat */
.bodyfig{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;max-width:360px;margin:0 auto}
.bodyfig svg{width:100%;height:auto;display:block}
.bodyfig .mu{stroke:var(--card);stroke-width:1.3;cursor:pointer;transition:opacity .2s}
.bodyfig.hassel .mu:not(.on){opacity:.32}
.bodyfig .mu.on{stroke:var(--ink);stroke-width:2.2}
.bodyfig svg{filter:drop-shadow(0 6px 14px rgba(0,0,0,.07))}
.zsum{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.zp{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap;flex:none}
.zp b{font-weight:850}
.zp.z0{background:var(--card2);color:var(--mute)}
.zp.z1{background:color-mix(in srgb,var(--z1) 60%,transparent);color:light-dark(#8f3f22,#ffc2ab)}
.zp.z2{background:color-mix(in srgb,var(--z2) 28%,transparent);color:light-dark(#a3401c,#ffb08f)}
.zp.z3{background:color-mix(in srgb,var(--z3) 16%,transparent);color:var(--acc)}
.zp.z4{background:var(--z4);color:light-dark(#fff,#2a0806)}
.zleg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.zleg span{display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.zleg i{width:100%;height:8px;border-radius:5px;display:block}
.zleg b{font-weight:700;font-size:12px}
.zleg small{color:var(--mute);font-size:11px;font-variant-numeric:tabular-nums}
.hdet{background:var(--card2);border-radius:16px;padding:12px 14px;margin-top:10px}
.hdet .list>*+*{border-color:color-mix(in srgb,var(--ink) 9%,transparent)}
.hhint{text-align:center;font-size:12.5px;margin:10px 0 0}
button.mbar{width:100%;text-align:left;border-radius:10px;padding:5px 6px;margin:0 -6px;width:calc(100% + 12px)}
.mbar.on{background:var(--card2)}
.mbar .b{position:relative}
.mbar .b u{position:absolute;top:0;bottom:0;z-index:1;pointer-events:none;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--good) 38%,transparent) 0 2px,transparent 2px 5px);box-shadow:inset 1.5px 0 0 var(--good),inset -1.5px 0 0 var(--good)}
.bandk{display:inline-block;width:18px;height:9px;vertical-align:-1px;border-radius:3px;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--good) 45%,transparent) 0 2px,transparent 2px 5px);box-shadow:inset 0 0 0 1px var(--good)}
.xth{border-radius:12px;object-fit:cover;background:#fff;flex:none;display:block;box-shadow:inset 0 0 0 1px var(--line)}
.xth.ph{display:grid;place-items:center;color:var(--mute);background:var(--card2);box-shadow:none}
.xrow{gap:12px;padding:9px 6px;margin:0 -6px;width:calc(100% + 12px);border-radius:12px}
.xrow.on{background:var(--accSoft)}
.xck{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:#fff}
.xrow.on .xck{background:var(--acc);border-color:var(--acc)}
.list>.xsec,.list>.xsec+*{border-top:0}
.xsec{display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:750;color:var(--mute);text-transform:uppercase;letter-spacing:.05em;padding:16px 2px 4px}
.xbar{position:sticky;bottom:calc(-24px - env(safe-area-inset-bottom));padding:16px 0 calc(12px + env(safe-area-inset-bottom));margin-top:6px;background:linear-gradient(transparent,var(--sheetBg,var(--bg)) 35%)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--card2);border-radius:13px;padding:3px;margin:0 0 14px}
.seg button{display:grid;place-items:center;text-align:center;height:38px;border-radius:10px;font-weight:650;font-size:14px;color:var(--mute)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.dnav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.dlab{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.dlab b{font:800 18px var(--d)}
.dlab .sub{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.kbar{height:9px;border-radius:9px;background:var(--card2);overflow:hidden;margin:12px 0 4px}.kbar i{display:block;height:100%;border-radius:9px;transition:width .3s}
.pmut .li{opacity:.62;padding:9px 0}
.mact{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:6px;margin-top:8px}
.zp.sok{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
.zp.ssw{background:color-mix(in srgb,#2a6fe5 14%,transparent);color:light-dark(#2a6fe5,#8db4ff)}
.zp.ssk,.zp.spe{background:var(--card2);color:var(--mute)}
.xtag{font:700 10.5px var(--f);color:var(--acc);background:var(--accSoft);padding:2px 6px;border-radius:6px;vertical-align:2px;margin-left:4px;white-space:nowrap}
.ftag{font-size:11px;font-weight:700;color:var(--mute);background:var(--card2);padding:3px 7px;border-radius:7px;flex:none}
.famt{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:14px}
.famt div{background:var(--card2);border-radius:14px;padding:10px 4px;text-align:center}
.famt b{display:block;font:800 20px var(--d)}
.famt span{font-size:11.5px;color:var(--mute);font-weight:600}
.dots{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px;margin-top:14px}
.dots span{display:flex;flex-direction:column;align-items:center;gap:3px}
.dots i{width:100%;aspect-ratio:1;border-radius:6px;display:block}
.dots small{font-size:10px;color:var(--mute)}
.dk{width:9px;height:9px;border-radius:3px;display:block}
.kbars{position:relative;display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px;height:140px;align-items:end;padding-bottom:16px;margin-top:18px}
.kbars div{height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative}
.kbars i{width:100%;border-radius:5px 5px 2px 2px;display:block;min-height:2px}
.kbars small{position:absolute;bottom:-16px;font-size:10px;color:var(--mute)}
.kbars em{position:absolute;left:0;right:0;border-top:1.5px dashed var(--ink);opacity:.55;z-index:1;pointer-events:none}
.kbars em span{position:absolute;right:0;top:-17px;font:650 10.5px var(--f);font-style:normal;color:var(--ink)}

.bfig{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.bfig .bodyfig{gap:2px}.bfh{text-align:center;font-size:12.5px;font-weight:700;color:var(--mute);margin-bottom:4px}
#nav button{position:relative}#nav button.dot::after{content:'';position:absolute;top:6px;left:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 2px var(--card)}
body.resting main{padding-bottom:110px!important}
#rest{position:fixed;left:12px;right:12px;z-index:40;max-width:560px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:18px;padding:10px 10px 10px 14px;box-shadow:0 10px 30px rgba(0,0,0,.25);overflow:hidden}
#rest.done{background:var(--good);color:#fff}
#rest .rbar{position:absolute;left:0;top:0;right:0;height:3px;background:color-mix(in srgb,currentColor 18%,transparent)}
#rest .rbar i{display:block;height:100%;background:var(--acc);transition:width .25s linear}
#rest.done .rbar i{background:#fff}
#rest .rl{font-size:11.5px;font-weight:700;opacity:.7;text-transform:uppercase;letter-spacing:.05em}
#rest .rn{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#rest .rt{font:850 28px/1 var(--d);font-variant-numeric:tabular-nums;margin-right:4px}
#rest.done .rt{font-size:17px}
#rest .rb{min-width:44px;height:40px;border-radius:12px;background:color-mix(in srgb,currentColor 14%,transparent);color:inherit;font-weight:750;font-size:13.5px;display:grid;place-items:center;padding:0 6px}
.edg2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.edg2 label{display:block;font-size:12px;font-weight:600;color:var(--mute);margin:0 0 4px 2px}

.bodyfig figcaption{text-align:center;font-size:12px;color:var(--mute);font-weight:600}
.bodyfig path,.bodyfig ellipse,.bodyfig rect{stroke:var(--card);stroke-width:1.4;transition:fill .4s}
.legend{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--mute);justify-content:center;margin:10px 0 4px;flex-wrap:wrap}
.legend i{width:20px;height:10px;border-radius:3px;display:block}
.mbar{display:grid;grid-template-columns:96px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:14px;padding:4px 0}
.mbar .b{height:9px;border-radius:9px;background:var(--card2);overflow:hidden}.mbar .b i{display:block;height:100%;border-radius:9px}
.mbar .v{text-align:right;font:650 14px var(--d);font-variant-numeric:tabular-nums}
.ai{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--acc);background:var(--accSoft);padding:4px 9px;border-radius:999px}
.pulse{animation:pl 1.2s ease-in-out infinite}@keyframes pl{50%{opacity:.4}}
/* chart */
.fig{position:relative;height:230px;touch-action:pan-y}.fig>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.fig text{font:600 11px var(--f);fill:var(--mute)}
/* sheet */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fd .2s}
.sheet{background:var(--bg);width:100%;max-width:540px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:10px 16px calc(24px + env(safe-area-inset-bottom));animation:up .3s cubic-bezier(.2,.9,.3,1);overscroll-behavior:contain}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.edrow{background:var(--card);border-radius:16px;padding:12px;margin-bottom:8px}
.edg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.edg.rir{grid-template-columns:repeat(4,minmax(0,1fr))}
.sw{position:relative;width:52px;height:32px;border-radius:99px;border:0;background:var(--card2);flex:none;transition:background .2s;padding:0}

<script>
{
const $=s=>document.querySelector(s);
const main=$('#main'),nav=$('#nav'),sheetEl=$('#sheet'),toastEl=$('#toast');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uidGen=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);

const DAYS=['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];

const dow=d=>(d.getDay()+6)%7;

const weekStart=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-dow(x));return x};

const ICONS={plus:'<path d="M12 5v14M5 12h14"/>',star:'<path d="M12 3.2l2.7 5.5 6 .9-4.35 4.25 1.03 6L12 17l-5.38 2.85 1.03-6L3.3 9.6l6-.9z"/>',dots:'<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>',back:'<path d="M15 5l-7 7 7 7"/>',chev:'<path d="M9 5l7 7-7 7"/>',down:'<path d="M6 9l6 6 6-6"/>',up:'<path d="M6 15l6-6 6 6"/>',check:'<path d="M5 12.5l4.5 4.5L19 7"/>',play:'<path d="M8 5.5l10.5 6.5L8 18.5z"/>',trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>',edit:'<path d="M4 20h4L19 9l-4-4L4 16v4zM14 6l4 4"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',share:'<path d="M12 3v13M7 8l5-5 5 5M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/>',flame:'<path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-3 2-4 2-6 1 1 2 2 2 3 0-3 0-5 1-7z"/>',spark:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/>',cal:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',chart:'<path d="M4 19V5M4 19h16M8 15l4-4 3 3 5-6"/>',dumb:'<path d="M6.5 6.5v11M3.5 9v6M17.5 6.5v11M20.5 9v6M6.5 12h11"/>',ruler:'<path d="M3 17L17 3l4 4L7 21zM7 13l2 2M10 10l2 2M13 7l2 2"/>',import:'<path d="M12 15V3M7 10l5 5 5-5M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/>'};
const ic=(n,s=22,fill)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="${fill?'currentColor':'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;

/* ---------- muscles & heat ---------- */
const MUS={chest:'Göğüs',front_delts:'Ön omuz',side_delts:'Yan omuz',rear_delts:'Arka omuz',traps:'Trapez',upper_back:'Orta sırt',lats:'Kanat (lat)',lower_back:'Bel',biceps:'Biceps',triceps:'Triceps',forearms:'Ön kol',abs:'Karın',obliques:'Yan karın',glutes:'Kalça',abductors:'Dış kalça',adductors:'İç bacak',quads:'Ön bacak',hamstrings:'Arka bacak',calves:'Baldır'};

const GUESS=[[/front raise/,['front_delts'],['side_delts']],[/upright row/,['side_delts','traps'],['biceps']],[/close.?grip (bench|press)|jm press/,['triceps'],['chest','front_delts']],[/reverse curl|zottman/,['forearms'],['biceps']],[/farmer|carry/,['forearms','traps'],[]],[/step.?up|bulgarian/,['quads','glutes'],['hamstrings']],[/bridge/,['glutes'],['hamstrings']],[/russian twist|woodchop|side bend|oblique/,['obliques'],['abs']],[/mekik/,['abs'],['obliques']],[/barfiks/,['lats'],['biceps','upper_back']],[/şınav|sinav/,['chest'],['triceps','front_delts']],[/omuz pres/,['front_delts'],['side_delts','triceps']],[/pazı|biceps/,['biceps'],['forearms']],[/arka kol|triceps/,['triceps'],[]],[/göğüs|gogus/,['chest'],['front_delts','triceps']],[/kürek|kurek/,['upper_back'],['lats','biceps']],[/sırt|sirt/,['lats'],['upper_back','biceps']],[/calf|baldır/,['calves'],[]],[/adduct/,['adductors'],[]],[/abduct/,['abductors'],['glutes']],[/leg ext/,['quads'],[]],[/leg curl|hamstring/,['hamstrings'],['calves']],[/squat|leg press|lunge|hack|split/,['quads','glutes'],['adductors']],[/deadlift|rdl|romanian|good morning/,['hamstrings','glutes'],['lower_back']],[/hip thrust|glute|kickback/,['glutes'],['hamstrings']],[/hyperext|back ext/,['lower_back'],['glutes']],[/crunch|plank|leg raise|sit.?up|\babs?\b/,['abs'],['obliques']],[/wrist/,['forearms'],[]],[/curl/,['biceps'],['forearms']],[/pushdown|extension|skull|tricep|french/,['triceps'],[]],[/dip/,['chest','triceps'],['front_delts']],[/lateral|side raise/,['side_delts'],['traps']],[/face pull|rear|reverse fly/,['rear_delts'],['upper_back']],[/shrug/,['traps'],[]],[/pulldown|pull.?up|chin|pullover/,['lats'],['biceps']],[/row/,['upper_back'],['lats','rear_delts','biceps']],[/shoulder press|overhead press|military|ohp|arnold/,['front_delts'],['side_delts','triceps']],[/fly|pec|crossover/,['chest'],['front_delts']],[/press|bench|push/,['chest'],['front_delts','triceps']]];

const mapOf=(n,xid)=>{const x=libOf({name:n,xid});if(x)return{p:x.m,s:x.s};return MAP[key(n)]||guess(n)};

const exId=e=>{if(e?.xid)return e.xid;const k=nz(e?.name);return LIB.exIdx[k]||LIB.exIdx[k.replace(/ /g,'')]||null};

/* ---------- heat (zones) ---------- */
const ZC=['var(--h0)','var(--z1)','var(--z2)','var(--z3)','var(--z4)'];
const ZN={week:{n:['Çalışılmadı','Az','Etkili','Yüksek','Çok yüksek'],r:['0','0,5–3,5','4–9,5','10–20','20+'],t:[4,10,20],band:[4,10],max:24,unit:'set / hafta',
  tip:['Bu kas hiç çalışmıyor.','Haftada 4 setin altında; gelişim için gereken minimum dozun altında kalıyor.','Kazanımın büyük kısmı bu aralıkta elde edilir; set başına verim en yüksek.','Daha fazla gelişim sağlayabilir ama her ek setin getirisi giderek azalır.','20 setin üstünde ek fayda belirsiz; toparlanmayı zorlayabilir, bir kısmını azaltmayı düşün.']},
 w:{n:['Yok','Hafif','Orta','Yoğun','Çok yoğun'],r:['0','0,5–1,5','2–3,5','4–8','8+'],t:[2,4,8],band:null,max:10,unit:'set',

    C=`<rect x="89" y="106" width="22" height="62" rx="8" fill="${c('abs')}" ${at('abs')}>${t('abs')}</rect><path d="M89 122h22M89 138h22M89 154h22M100 106v62" stroke="var(--card)" stroke-width="1.4" fill="none" pointer-events="none"/><path d="M88 170L112 170L108 182L92 182Z" fill="var(--neu)"/>`;
  }else{
    L=P('rear_delts','M70 72C61 69 53 75 53 87C53 95 56 100 60 101C64 93 66 85 71 78Z')+P('side_delts','M52 80C46 85 45 97 48 105C52 102 54 94 54 86Z')+P('upper_back','M92 90C85 84 78 81 73 81C72 93 78 104 89 110L95 104Z')+P('lats','M73 98C68 112 70 132 80 150C85 156 90 156 93 150L94 116C86 112 78 106 73 98Z')+E('triceps',52,121,7,17)+P('forearms','M46 142C40 152 40 172 44 186L50 186C54 170 56 152 54 142Z')+P('abductors','M79 164C73 168 72 178 76 187L83 176Z')+P('glutes','M100 172C92 170 81 172 79 184C77 198 86 207 100 205Z')+P('hamstrings','M79 210C75 228 77 248 83 262L93 262C97 246 97 226 96 210Z')+P('calves','M80 274C70 292 74 318 84 332C94 318 96 292 90 274Z');
    C=P('traps','M100 50C94 56 82 64 70 70C82 74 92 86 100 104C108 86 118 74 130 70C118 64 106 56 100 50Z')+P('lower_back','M95 142L105 142L110 170L90 170Z');
  }
  return `<svg viewBox="0 0 200 362" role="img" aria-label="${side==='f'?'Ön':'Arka'} görünüm kas haritası"><g fill="var(--neu)"><ellipse cx="100" cy="30" rx="15" ry="19"/><rect x="93" y="46" width="14" height="14" rx="4"/>${neuL}<g transform="matrix(-1 0 0 1 200 0)">${neuL}</g></g>${L}<g transform="matrix(-1 0 0 1 200 0)">${L}</g>${C}</svg>`;
}
function heatBlock(items,sc,opts={}){
  const bid=opts.id||sc,{h,by}=heatDetail(items),Z=ZN[sc];
  const sel=S.hsel[bid]&&MUS[S.hsel[bid]]?S.hsel[bid]:null;
  const keys=Object.keys(MUS),cnt=[0,0,0,0,0];keys.forEach(k=>cnt[zoneOf(h[k]||0,sc)]++);
  const top=Object.entries(h).filter(e=>e[1]>0).sort((a,b)=>b[1]-a[1]);
  const pill=(z)=>`<span class="zp z${z}">${Z.n[z]}</span>`;
  const bar=(k,v)=>{const z=zoneOf(v,sc);return`<button class="mbar press${sel===k?' on':''}" data-a="hsel" data-b="${bid}" data-k="${k}"><span>${MUS[k]}</span><div class="b">${Z.band?`<u style="left:${Z.band[0]/Z.max*100}%;width:${(Z.band[1]-Z.band[0])/Z.max*100}%"></u>`:''}<i style="width:${Math.min(100,v/Z.max*100)}%;background:${ZC[z]}"></i></div><span class="v">${fmt(v)}</span></button>`};

    const need=sc==='week'&&z<2?Math.ceil((4-v)*2)/2:0;
    det=`<div class="hdet"><div class="row"><h3 class="sp">${MUS[sel]}</h3>${pill(z)}<button class="ibtn" style="width:32px;height:32px" data-a="hsel" data-b="${bid}" data-k="${sel}" aria-label="Seçimi kaldır">${ic('x',16)}</button></div>

/* ---------- AI muscle mapping ---------- */
const getSample=()=>Promise.resolve(null);
async function ensureMap(uid,pid){
  if(!LIB.ex){loadEx();return}const p=progOf(uid,pid);if(!p||S.ai[pid])return;
  const names=[...new Set(p.workouts.flatMap(w=>w.exercises.map(e=>e.name.trim())).filter(Boolean))];
  const missing=names.filter(n=>!known({name:n}));if(!missing.length)return;
  S.ai[pid]=true;soft();
  const got={};const sample=await getSample();
  if(sample){try{
    const prompt=`Sen deneyimli bir egzersiz bilimcisisin. Aşağıdaki fitness hareketlerinin her biri için çalışan kasları belirle.\nİzin verilen kas anahtarları: ${Object.keys(MUS).join(', ')}.\n"p": hareketin ana hedef kasları (1-2 adet). "s": belirgin yardımcı kaslar (0-3 adet). Yalnızca izin verilen anahtarları kullan.\nHareketler:\n${missing.map(n=>'- '+n).join('\n')}\n\nYalnızca şu biçimde JSON döndür, anahtar olarak hareket adını aynen kullan: {"<hareket adı>":{"p":["..."],"s":["..."]}}`;
    const r=await sample.json(prompt,{modelTier:'quick'});
    const rk={};for(const[k,v]of Object.entries(r||{}))rk[key(k)]=v;
    for(const n of missing){const c=cleanMap(rk[key(n)]);if(c)got[key(n)]=c}
  }catch(e){if(e?.code==='rate_limited')toast('Yapay zeka şu an meşgul, tahmini eşleme kullanıldı.')}}
  for(const n of missing)if(!got[key(n)]){const g=guess(n);if(g.p.length)got[key(n)]=g}
  Object.assign(AIMEM,got);rebuildMap();
  if(uid===S.me&&Object.keys(got).length){const cur=progOf(uid,pid);if(cur)await saveDoc(P(uid,'programs',pid),{...strip(cur),map:{...(cur.map||{}),...got}})}
  S.ai[pid]=false;soft();
}

/* ---------- history ---------- */
function hist(uid){const m={};for(const s of doneSessions(uid))for(const e of s.exercises||[]){const sets=(e.sets||[]).filter(x=>x.r>0&&x.w!=null);if(!sets.length)continue;const k=hk(e);const top=sets.reduce((a,b)=>b.w>a.w||(b.w===a.w&&b.r>a.r)?b:a);(m[k]||(m[k]={name:e.name,ents:[]})).ents.push({date:s.date,wname:s.workoutName,sets,top,e1:Math.max(...sets.map(x=>x.w*(1+x.r/30))),vol:sets.reduce((a,x)=>a+x.w*x.r,0),reps:sets.reduce((a,x)=>a+x.r,0)})}return m}
const METRICS={w:['En ağır set','kg',e=>e.top.w],e1:['Tahmini 1RM','kg',e=>e.e1],vol:['Hacim','kg',e=>e.vol],reps:['Toplam tekrar','',e=>e.reps]};
/* Aynı gün (workout) içindeki son kaydı tercih et; yoksa herhangi bir günün son kaydına düş */
function prevSets(name,excl,wid){const k=hk(typeof name==='string'?{name}:name);const ss=doneSessions(S.me).filter(s=>s.id!==excl);
  const find=only=>{for(let i=ss.length-1;i>=0;i--){if(only&&ss[i].workoutId!==wid)continue;const e=(ss[i].exercises||[]).find(x=>hk(x)===k);if(e&&e.sets?.some(x=>x.r>0))return e.sets.filter(x=>x.r>0)}return null};
  return(wid&&find(true))||find(false)}
function lastTop(uid,name,wid){const k=hk(typeof name==='string'?{name}:name);let any=null;const ss=doneSessions(uid);for(let i=ss.length-1;i>=0;i--){const e=(ss[i].exercises||[]).find(x=>hk(x)===k);const sets=(e?.sets||[]).filter(x=>x.r>0&&x.w!=null);if(!sets.length)continue;const top=sets.reduce((a,b)=>b.w>a.w||(b.w===a.w&&b.r>a.r)?b:a);if(!wid||ss[i].workoutId===wid)return top;any=any||top}return any}

/* ---------- charts ---------- */
const CH={};let ROs=[];
function mountCharts(){ROs.forEach(r=>r.disconnect());ROs=[];document.querySelectorAll('.fig[data-c]').forEach(f=>{const cfg=CH[f.dataset.c];if(!cfg)return;const svg=f.querySelector('svg');const draw=()=>drawLine(svg,cfg,f,f.dataset.c);const ro=new ResizeObserver(draw);ro.observe(f);ROs.push(ro);
  const pick=ev=>{const r=f.getBoundingClientRect();cfg.sel=ev.clientX-r.left;draw()};f.onpointerdown=pick;f.onpointermove=ev=>{if(ev.buttons||ev.pointerType==='mouse')pick(ev)};f.onpointerleave=()=>{if(cfg.sel!=null){cfg.sel=null;draw()}}})}
function drawLine(svg,cfg,f,id){
  const W=f.clientWidth,H=f.clientHeight;if(!W)return;
  const all=cfg.series.flatMap(s=>s.pts);if(!all.length){svg.innerHTML=`<text x="${W/2}" y="${H/2}" text-anchor="middle">Henüz kayıt yok</text>`;return}
  const L=42,R=16,T=20,B=26;
  let x0=Math.min(...all.map(p=>p.x)),x1=Math.max(...all.map(p=>p.x));if(x0===x1){x0-=864e5*3;x1+=864e5*3}
  let y0=Math.min(...all.map(p=>p.y)),y1=Math.max(...all.map(p=>p.y));const pd_=(y1-y0)*.18||Math.max(1,y1*.1);y0=Math.max(0,y0-pd_);y1+=pd_;
  const X=x=>L+(x-x0)/(x1-x0)*(W-L-R),Y=y=>T+(1-(y-y0)/(y1-y0))*(H-T-B);
  let g='';for(let i=0;i<=3;i++){const v=y0+(y1-y0)*i/3,yy=Y(v);g+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${L-8}" y="${yy+4}" text-anchor="end">${v>=1000?fmtK(v):fmt(v)}</text>`}
  const xs=W>380?[x0,(x0+x1)/2,x1]:[x0,x1];const dl=t=>{const d=new Date(t);return d.getDate()+' '+MONTHS[d.getMonth()].slice(0,3)};
  xs.forEach((t,i)=>g+=`<text x="${X(t)}" y="${H-6}" text-anchor="${i===0?'start':i===xs.length-1?'end':'middle'}">${dl(t)}</text>`);
  let s='';
  cfg.series.forEach((se,si)=>{const pts=se.pts;if(!pts.length)return;const d=pts.map((p,i)=>(i?'L':'M')+X(p.x).toFixed(1)+' '+Y(p.y).toFixed(1)).join('');
    if(si===0)s+=`<defs><linearGradient id="g${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${se.color}" stop-opacity=".28"/><stop offset="1" stop-color="${se.color}" stop-opacity="0"/></linearGradient></defs><path d="${d}L${X(pts.at(-1).x)} ${H-B}L${X(pts[0].x)} ${H-B}Z" fill="url(#g${id})"/>`;
    s+=`<path d="${d}" fill="none" stroke="${se.color}" stroke-width="${si?2:2.8}" stroke-linejoin="round" stroke-linecap="round" ${si?'stroke-dasharray="5 4"':''}/>`;
    if(pts.length<40)s+=pts.map(p=>`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="${si?3:3.6}" fill="var(--card)" stroke="${se.color}" stroke-width="2"/>`).join('');
    if(si===0&&cfg.sel==null){const p=pts.at(-1);s+=`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="6" fill="${se.color}"/><text x="${Math.min(X(p.x),W-R)}" y="${Y(p.y)-12}" text-anchor="end" style="fill:var(--ink);font-size:13px;font-weight:700">${esc(p.lab)}</text>`}});
  if(cfg.sel!=null){const p0=cfg.series[0].pts;if(p0.length){const p=p0.reduce((a,b)=>Math.abs(X(b.x)-cfg.sel)<Math.abs(X(a.x)-cfg.sel)?b:a);const px=X(p.x),py=Y(p.y);const txt=`${dl(p.x)} · ${p.lab}`;const tw=txt.length*6.8+18;const tx=Math.min(Math.max(px-tw/2,2),W-tw-2);
    s+=`<line x1="${px}" x2="${px}" y1="${T}" y2="${H-B}" stroke="var(--mute)" stroke-dasharray="3 3"/><circle cx="${px}" cy="${py}" r="6.5" fill="${cfg.series[0].color}"/><rect x="${tx}" y="0" width="${tw}" height="24" rx="8" fill="var(--ink)"/><text x="${tx+tw/2}" y="16" text-anchor="middle" style="fill:var(--bg);font-weight:700">${esc(txt)}</text>`}}
  svg.innerHTML=g+s;
}
const spark=(vals)=>{if(vals.length<2)return'<svg width="72" height="28"></svg>';const mn=Math.min(...vals),mx=Math.max(...vals),r=mx-mn||1;const d=vals.map((v,i)=>(i?'L':'M')+(i/(vals.length-1)*70+1).toFixed(1)+' '+(25-(v-mn)/r*22).toFixed(1)).join('');return`<svg width="72" height="28" viewBox="0 0 72 28"><path d="${d}" fill="none" stroke="var(--acc)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`};

async function activatePlan(pid){const me=S.me;if(!(await saveDoc(P(me,'nutrition','active'),{pid,upd:Date.now()})))return;
  const t=todayS(),L=logOf(me,t);if(L&&L.pid&&L.pid!==pid){const old=planById(me,L.pid),pl=planById(me,pid);const mapM=mid=>{const om=old?.meals.find(m=>m.id===mid);const nm=om&&pl?.meals.find(m=>nz(m.name)===nz(om.name));return nm?nm.id:'snack'};const n=clone(L);n.pid=pid;n.m={};n.x=(n.x||[]).map(x=>({...x,mid:x.mid==='snack'?'snack':mapM(x.mid)}));
    for(const[k,v]of Object.entries(L.m||{})){const om=old?.meals.find(m=>m.id===k);const its=v.st==='ok'?(om?.items||[]):v.st==='swap'?(v.items||[]):[];n.x.push(...its.map(i=>({...clone(i),id:uidGen(),mid:mapM(k)})))}await saveLog(t,n)}
  toast('Aktif plan: '+(planById(me,pid)?.name||'Plan'))}

  case'ntsave':{const pl=myPlan();pl.name=(ED.name||'').trim()||'Beslenme planı';pl.note=(ED.note||'').trim();pl.target={};for(const k of['kcal','p','c','f'])if(ED.t[k]!=null)pl.target[k]=ED.t[k];if(await savePlan(pl)){closeSheet();toast('Kaydedildi')}break}

async function finishLive(){stopRest();const d=LIVE.doc;

function fListHTML(){const E=ED,q=(E.q||'').trim();const m=meta();let h='';

    return`<div class="xsec">${note}</div>`+(v.length?v.map((f,i)=>fRow(f,i,k)).join(''):'<p class="sub" style="padding:8px 2px">Sonuç yok.</p>')};

    if(!qk&&m.g>0){const s=100/m.g;it.b={k:r1(m.kcal*s),p:r1((m.p||0)*s),c:r1((m.c||0)*s),f:r1((m.f||0)*s)};
      if(m.save){const id='my'+uidGen();await saveDoc(P(S.me,'foods',id),{n:it.name,k:Math.round(it.b.k),p:it.b.p,c:it.b.c,f:it.b.f,u:[],cat:'Benim',s:'Elle girildi'});it.fid=id}}

  pushSheet(()=>recRender(),{kind:'rec',fid,name:f?.n||'',ings:clone(f?.ing||[]),cooked:f?.cooked??null,por:f?.por??null})}
function recTot(){return nsum(ED.ings)}

  ${E.ings.length?`<div class="famt" style="margin-top:12px"><div><b class="num">${fmtK(t.kcal*per)}</b><span>kcal/100 g</span></div><div><b class="num">${fmt(t.p*per)}</b><span>Protein</span></div><div><b class="num">${fmt(t.c*per)}</b><span>Karb.</span></div><div><b class="num">${fmt(t.f*per)}</b><span>Yağ</span></div></div>`:''}

    const doc={n:n.slice(0,60),k:Math.round(t.kcal*s),p:r1(t.p*s),c:r1(t.c*s),f:r1(t.f*s),u:E.por>0?[['1 porsiyon',r1(w/E.por)]]:[],cat:'Tarif',ing:E.ings.map(i=>({name:i.name,g:i.g,kcal:i.kcal,p:i.p,c:i.c,f:i.f,fid:i.fid||null})),cooked:E.cooked||null,por:E.por||null,s:'Kendi tarifin: '+E.ings.map(i=>`${fmt(i.g)} g ${i.name}`).join(', ')+` → ${fmtK(w)} g`};

  }});

/* ---------- daily log ---------- */
const DEFMEALS=[['k','Kahvaltı'],['o','Öğle'],['a','Akşam']];
function dayMeals(pl){const ms=pl?.meals?.length?pl.meals.map(m=>({id:m.id,name:m.name,plan:m.items})):DEFMEALS.map(([id,name])=>({id,name,plan:[]}));ms.push({id:'snack',name:'Ara öğün / plan dışı',plan:[],snack:true});return ms}
function dayCalc(pl,log,date){log=log||{};if(log.pid){const alt=planById(S.me,log.pid);if(alt)pl=alt}const free=!!log.free||!pl?.meals?.length;const ms=dayMeals(pl);const xs=log.x||[];
  const meals=ms.map(m=>{const st=free||m.snack?null:(log.m?.[m.id]?.st||null);const extra=xs.filter(x=>x.mid===m.id||(m.snack&&!ms.some(z=>z.id===x.mid)));const planS=nsum(m.plan);
    const base=free||m.snack?[]:st==='ok'?m.plan:st==='swap'?(log.m[m.id].items||[]):[];const eat=nsum(base.concat(extra));
    return{...m,st,extra,base,planS,eat,done:free||m.snack?true:!!st}});
  const eat=nsum(meals.flatMap(m=>m.base.concat(m.extra)));const planTot=nsum(ms.flatMap(m=>m.plan));const ref=planTot.kcal||pl?.target?.kcal||0;
  const pending=!free&&meals.some(m=>!m.snack&&m.plan.length&&!m.st);
  const dev=free?eat.kcal-ref:meals.reduce((a,m)=>a+(m.snack||!m.st?m.eat.kcal:m.eat.kcal-m.planS.kcal),0);
  const logged=free?xs.length>0:meals.some(m=>m.st||m.extra.length);
  const tol=Math.max(150,ref*.1);const ok=!logged||pending||!ref?null:Math.abs(eat.kcal-ref)<=tol;
  return{free,meals,eat,planTot,ref,pending,dev,logged,ok,tol}}
const logOf=(uid,d)=>U(uid).nlog?.[d]||null;
let scoreT=0;
function saveLog(date,log){const doc={...strip(log),date,upd:Date.now()};if(!doc.pid&&U(S.me).nact)doc.pid=U(S.me).nact;U(S.me).nlog=U(S.me).nlog||{};U(S.me).nlog[date]=doc;clearTimeout(scoreT);scoreT=setTimeout(saveScore,1500);return saveDoc(P(S.me,'nlog',date),doc)}
const curLog=d=>clone(logOf(S.me,d)||{date:d,free:false,m:{},x:[]});
function weekScore(uid){const pl=U(uid).nutrition,t=todayS();let n=0,ok=0;const days={};for(let i=13;i>=0;i--){const d=addDays(t,-i);const c=dayCalc(pl,logOf(uid,d),d);const v=c.ok==null?(c.logged?'part':'none'):c.ok?'ok':'off';days[d]=v;if(i<7&&c.ok!=null){n++;if(c.ok)ok++}}return{n,ok,score:n?Math.round(ok/n*100):null,days}}
function saveScore(){const ws=weekScore(S.me);const cur=U(S.me).nscore;const doc={upd:Date.now(),score:ws.score,n:ws.n,ok:ws.ok,days:ws.days};if(cur&&cur.score===doc.score&&cur.n===doc.n&&JSON.stringify(cur.days)===JSON.stringify(doc.days))return;saveDoc(P(S.me,'nutrition','score'),doc)}
function tdee(uid){const t=todayS(),from=addDays(t,-28),pl=U(uid).nutrition;const kc=[];for(let i=28;i>=1;i--){const d=addDays(t,-i);const c=dayCalc(pl,logOf(uid,d),d);if(c.logged&&!c.pending&&c.eat.kcal>500)kc.push(c.eat.kcal)}
  const ws=(U(uid).measures||[]).filter(m=>m.date>=from&&m.date<t&&m.values?.weight>0).map(m=>({x:(pd(m.date)-pd(from))/864e5,y:m.values.weight}));
  const need={days:kc.length,weights:ws.length,span:ws.length?ws.at(-1).x-ws[0].x:0};if(kc.length<14||ws.length<2||need.span<10)return{ok:false,need};

function restBuild(){const done=REST.end<=Date.now();restEl.className=done?'done':'';
  restEl.innerHTML=`<div class="rbar"><i></i></div><div class="row" style="gap:6px"><div class="sp" style="min-width:0"><div class="rl">${done?'Dinlenme bitti':'Dinlenme'}</div><div class="rn">${esc(REST.name||'')}</div></div><b class="rt num"></b>${done?'':`<button class="rb" data-a="rest" data-v="-15" aria-label="15 saniye azalt">−15</button><button class="rb" data-a="rest" data-v="15" aria-label="15 saniye artır">+15</button>`}<button class="rb x" data-a="rest" data-v="0" aria-label="Dinlenmeyi bitir">${ic('x',16)}</button></div>`;REST._b=done?2:1}

  const b=restEl.querySelector('.rbar i');if(b)b.style.width=Math.min(100,Math.max(0,(1-left/REST.dur)*100))+'%'}

/* ---------- demo store (used only when the page is opened outside claude.ai) ---------- */
function memDB(){const st=new Map(),ls=new Set();const snapDoc=(p)=>({id:p.split('/').pop(),exists:st.has(p),data:()=>st.get(p),metadata:{fromCache:false,hasPendingWrites:false}});
  const colDocs=c=>[...st.keys()].filter(k=>k.startsWith(c+'/')&&k.split('/').length===c.split('/').length+1).sort().map(snapDoc);
  const fire=()=>queueMicrotask(()=>ls.forEach(f=>f()));
  const docRef=p=>({id:p.split('/').pop(),path:p,get:async()=>snapDoc(p),set:async d=>{st.set(p,clone(d));fire()},update:async d=>{st.set(p,{...st.get(p),...clone(d)});fire()},delete:async()=>{st.delete(p);fire()},onSnapshot:(n)=>{const f=()=>n(snapDoc(p));ls.add(f);queueMicrotask(f);return()=>ls.delete(f)},collection:c=>colRef(p+'/'+c)});
  const colRef=c=>({path:c,doc:id=>docRef(c+'/'+(id||uidGen())),add:async d=>{const r=docRef(c+'/'+uidGen());await r.set(d);return r},get:async()=>{const d=colDocs(c);return{docs:d,size:d.length,empty:!d.length,metadata:{fromCache:false}}},onSnapshot:n=>{const f=()=>{const d=colDocs(c);n({docs:d,size:d.length,empty:!d.length,docChanges:()=>[],metadata:{fromCache:false}})};ls.add(f);queueMicrotask(f);return()=>ls.delete(f)},where(){return this},orderBy(){return this},limit(){return this}});
  return{doc:docRef,collection:colRef}}

const SB_URL='https://axdeavmuiskxigfjwejk.supabase.co',SB_KEY='sb_publishable_nWMWZGNxCZ_WTVhPf2Z9Zw_Ty_KBrt_';
let sb=null;
function sbDB(){
  const cache=new Map(),ls=new Set();let loaded=false;
  const K=(u,c,i)=>u+'|'+c+'|'+i;
  const fire=()=>{if(loaded)queueMicrotask(()=>ls.forEach(f=>f()))};
  const parse=p=>{const s=p.split('/');return s.length===2?{u:s[1],c:'profile',i:'me'}:{u:s[1],c:s[2],i:s[3]}};
  const snap=(id,d)=>({id,exists:d!==undefined,data:()=>d,metadata:{fromCache:false,hasPendingWrites:false}});
  const list=path=>{const s=path.split('/'),out=[];if(s.length===1){for(const[k,v]of cache){const[u,c]=k.split('|');if(c==='profile')out.push(snap(u,v))}}else{const pre=s[1]+'|'+s[2]+'|';for(const[k,v]of cache)if(k.startsWith(pre))out.push(snap(k.slice(pre.length),v))}return{docs:out,size:out.length,empty:!out.length,docChanges:()=>[],metadata:{fromCache:false}}};
  async function load(){const all=[];for(let from=0;;from+=1000){const{data,error}=await sb.from('docs').select('user_id,col,id,data').range(from,from+999);if(error)throw error;all.push(...data);if(data.length<1000)break}cache.clear();for(const r of all)cache.set(K(r.user_id,r.col,r.id),r.data);loaded=true;fire()}
  const mapErr=e=>({code:e?.code==='42501'||/row-level security|permission/i.test(e?.message||'')?'invalid_argument':'unavailable',message:e?.message});
  const docRef=p=>({path:p,get:async()=>{const{u,c,i}=parse(p);return snap(i,cache.get(K(u,c,i)))},
    set:async d=>{const{u,c,i}=parse(p),k=K(u,c,i),old=cache.get(k);cache.set(k,clone(d));fire();const{error}=await sb.from('docs').upsert({user_id:u,col:c,id:i,data:d,updated_at:new Date().toISOString()});if(error){old===undefined?cache.delete(k):cache.set(k,old);fire();throw mapErr(error)}},
    delete:async()=>{const{u,c,i}=parse(p),k=K(u,c,i),old=cache.get(k);cache.delete(k);fire();const{error}=await sb.from('docs').delete().match({user_id:u,col:c,id:i});if(error){if(old!==undefined)cache.set(k,old);fire();throw mapErr(error)}}});
  const colRef=p=>({path:p,get:async()=>list(p),onSnapshot:n=>{const f=()=>n(list(p));ls.add(f);if(loaded)queueMicrotask(f);return()=>ls.delete(f)},doc:id=>docRef(p+'/'+id)});
  return{doc:docRef,collection:colRef,load,live(){
    sb.channel('docs-live').on('postgres_changes',{event:'*',schema:'public',table:'docs'},pl=>{if(pl.eventType==='DELETE'){const o=pl.old;if(o?.user_id)cache.delete(K(o.user_id,o.col,o.id))}else{const r=pl.new;if(r?.user_id)cache.set(K(r.user_id,r.col,r.id),r.data)}fire()}).subscribe();
    document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!LIVE)load().catch(()=>{})});
  }};
}

  return`<div style="padding-top:24px">${brand()}<div class="card"><div class="chips" style="margin-bottom:4px"><button class="chip ${m==='in'?'on':''}" data-a="amode" data-m="in">Giriş yap</button><button class="chip ${m==='up'?'on':''}" data-a="amode" data-m="up">Kayıt ol</button></div>

const trErr=m=>/already registered|already been registered/i.test(m)?'Bu e-posta zaten kayıtlı. Giriş yap sekmesini kullan.':/invalid login/i.test(m)?'E-posta veya parola hatalı.':/not confirmed/i.test(m)?'E-postanı henüz onaylamadın. Gelen kutundaki bağlantıya tıkla.':/at least 6|weak/i.test(m)?'Parola en az 6 karakter olmalı.':/rate limit|too many|seconds/i.test(m)?'Çok fazla deneme yapıldı. Biraz bekleyip tekrar dene.':/invalid.*email|email.*invalid/i.test(m)?'Geçerli bir e-posta adresi gir.':'Bir sorun oluştu: '+m;
const setMsg=(m,ok)=>{S.authMsg=m;S.authOk=!!ok;render()};
const backTo=()=>location.origin+location.pathname;
document.addEventListener('submit',async ev=>{const f=ev.target;if(f.id!=='af'&&f.id!=='jf')return;ev.preventDefault();const btn=f.querySelector('button[type=submit]');const txt=btn.textContent;btn.disabled=true;btn.textContent='Lütfen bekle…';

/* ---------- boot ---------- */
async function boot(){
  S.month=new Date(new Date().getFullYear(),new Date().getMonth(),1);
  if(location.hash==='#demo'){S.demo=true;S.phase='app';startData(memDB(),'demo-user','demo@ornek.com');return}
  if(!window.supabase){S.phase='error';S.err='Bağlantı kütüphanesi yüklenemedi. İnternetini kontrol edip sayfayı yenile.';render();return}
  sb=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  sb.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY'){S.phase='auth';S.authMode='newpw';S.authMsg='';render()}});
  S.phase='loading';render();
  const{data:{session}}=await sb.auth.getSession();
  if(S.authMode==='newpw')return;
  if(!session){S.phase='auth';render();return}
  if(/access_token|type=signup|code=/.test(location.href))history.replaceState(null,'',backTo());
  await afterLogin(session.user);
}
let started=false;
async function afterLogin(user){
  if(started)return;S.email=user.email;
  const{data,error}=await sb.rpc('is_member');
  if(error){S.phase='error';S.err='Sunucuya ulaşılamadı. Biraz sonra sayfayı yenile.';render();return}
  if(!data){S.phase='invite';render();return}
  try{const r=await sb.rpc('is_admin');S.admin=!!r.data}catch{S.admin=false}
  started=true;S.phase='loading';S.err='';render();
  const db=sbDB();
  try{await db.load()}catch(e){started=false;S.phase='error';S.err='Veriler yüklenemedi. Sayfayı yenile.';render();return}
  db.live();S.phase='app';startData(db,user.id,user.email);
}
function startData(db,uid,email){
  S.db=db;S.me=uid;S.view=uid;S.email=email;loadEx();
  db.collection('ud').onSnapshot(snap=>{
    for(const d of snap.docs){const u=U(d.id);u.profile={...d.data()};subUser(d.id)}
    for(const id of Object.keys(S.users))if(!snap.docs.some(d=>d.id===id))S.users[id].profile=null;
    const has=!!U(uid).profile;
    if(!S.ready){S.ready=true;S.onboard=!has}else if(has&&S.onboard)S.onboard=false;
    soft();
  });
}
function subUser(uid){const u=U(uid);if(u.subs)return;u.subs=true;const map=s=>s.docs.map(d=>({id:d.id,...d.data()}));const onErr=()=>{};
  S.db.collection(`ud/${uid}/programs`).onSnapshot(s=>{u.programs=map(s).sort((a,b)=>(b.star?1:0)-(a.star?1:0)||(a.created||0)-(b.created||0));rebuildMap();soft()},onErr);
  S.db.collection(`ud/${uid}/sessions`).onSnapshot(s=>{u.sessions=map(s);soft()},onErr);
  S.db.collection(`ud/${uid}/nutrition`).onSnapshot(s=>{u.nplans=s.docs.filter(x=>x.id==='plan'||x.id.startsWith('p_')).map(x=>({id:x.id,...x.data()})).sort((a,b)=>(a.created||0)-(b.created||0));const ac=s.docs.find(x=>x.id==='active')?.data()?.pid;u.nact=u.nplans.some(p=>p.id===ac)?ac:(u.nplans[0]?.id||null);const ap=u.nplans.find(p=>p.id===u.nact);u.nutrition=ap?{...ap}:null;const sc=s.docs.find(x=>x.id==='score');u.nscore=sc?{...sc.data()}:null;soft()},onErr);
  S.db.collection(`ud/${uid}/foods`).onSnapshot(s=>{u.foods=map(s);soft()},onErr);
  S.db.collection(`ud/${uid}/requests`).onSnapshot(s=>{u.requests=s.docs.map(d=>({id:d.id,...d.data()}));soft()},onErr);
  if(uid===S.me){S.db.collection(`ud/${uid}/nlog`).onSnapshot(s=>{u.nlog=Object.fromEntries(s.docs.map(d=>[d.id,{...d.data()}]));if(!u._sc){u._sc=1;setTimeout(saveScore,4000)}soft()},onErr);S.db.collection(`ud/${uid}/nmeta`).onSnapshot(s=>{const d=s.docs.find(x=>x.id==='me');u.nmeta=d?{...d.data()}:null;soft()},onErr)}
  S.db.collection(`ud/${uid}/measures`).onSnapshot(s=>{u.measures=map(s).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);soft()},onErr);
}
rebuildMap();boot();
}
